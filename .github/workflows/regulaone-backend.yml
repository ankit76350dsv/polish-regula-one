name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "regulaone/backend/prod" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Jar
        working-directory: auth-service-spring
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build Docker Image
        working-directory: auth-service-spring
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest .

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.KEY }}
          script: |
            docker stop regulaone-backend || true
            docker rm regulaone-backend || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest
            # Secrets are injected at runtime (no longer hardcoded in application.yml).
            # AWS creds: passed from GitHub secrets so Cognito/SES work without
            # requiring an EC2 instance-role change. Once the instance role has
            # cognito-idp + ses permissions, drop the two AWS_* lines to use it
            # (the app falls back to the instance role when they are absent).
            docker run -d --name regulaone-backend \
              -p 8080:8080 \
              --restart unless-stopped \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
              -e COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e COGNITO_CLIENT_ID="${{ secrets.VITE_COGNITO_CLIENT_ID }}" \
              -e COGNITO_DOMAIN="${{ secrets.VITE_COGNITO_DOMAIN }}" \
              -e COGNITO_ISSUER="https://cognito-idp.eu-central-1.amazonaws.com/${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e ALLOWED_ORIGINS="${{ secrets.AUTH_ALLOWED_ORIGINS }}" \
              -e LOG_LEVEL="INFO" \
              ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest
