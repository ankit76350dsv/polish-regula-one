name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "regulaone/backend/prod" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod   

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Jar
        working-directory: RegulaOne/backend
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # APP_VERSION is GitHub's run number: it goes up by one on every run of this
      # workflow, so the deployed build identifies itself without anyone editing a file.
      # It is baked into the image and reported by GET /health.
      #
      # The image gets TWO tags. "latest" is what the deploy pulls; the run number is an
      # immutable tag pointing at exactly this build, which is what makes a rollback
      # possible — without it, "version 42" names a build you can no longer get back.
      - name: Build Docker Image
        working-directory: RegulaOne/backend
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.run_number }} \
            -t ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:${{ github.run_number }} \
            .

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:${{ github.run_number }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.KEY }}
          script: |
            docker stop regulaone-backend || true
            docker rm regulaone-backend || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest

            #* ── CONFIGURATION ────────────────────────────────────────────────
            # The image contains NO application*.properties file — they are git-ignored,
            # so the checkout this is built from has none. Every setting therefore arrives
            # as an environment variable named after the SPRING PROPERTY it sets.
            #
            # That is why the -e names differ from the GitHub names: the secret keeps its
            # short shared name (MONGODB_URI), the variable must be what the application
            # reads (SPRING_MONGODB_URI).
            #
            # The groups below are in the SAME ORDER as the reference list in
            # RegulaOne/backend/src/main/resources/application-prod.properties.
            docker run -d --name regulaone-backend \
              -p 8080:8080 \
              --restart unless-stopped \
              `#! common for all applications — 5 secrets` \
              -e SPRING_MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e AWS_COGNITO_REGION="${{ secrets.COGNITO_REGION }}" \
              -e AWS_COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e AWS_COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
              -e AWS_COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
              `#! new for RegulaOne — 1 secret (same token as the module apps in prod)` \
              -e NOTIFICATION_INTERNAL_SERVICE_TOKEN="${{ secrets.NOTIFICATION_INTERNAL_TOKEN }}" \
              `#! LITERAL HERE — security flags, so a change needs a reviewed PR (6).` \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SSO_COOKIE_SECURE=true \
              -e SSO_COOKIE_SAME_SITE=Lax \
              -e SPRINGDOC_API_DOCS_ENABLED=false \
              -e SPRINGDOC_SWAGGER_UI_ENABLED=false \
              -e NOTIFICATION_TEST_ENABLED=false \
              `#! GITHUB VARIABLES — change without a code change (4)` \
              -e APP_NOTIFICATIONS_FROM="${{ vars.NOTIFICATION_FROM_EMAIL }}" \
              -e CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS }}" \
              -e SSO_COOKIE_DOMAIN="${{ vars.SSO_COOKIE_DOMAIN }}" \
              -e SSO_CENTRAL_LOGIN_URL="${{ vars.SSO_CENTRAL_LOGIN_URL }}" \
              `#! NOT PASSED — rate limiting: the code defaults are already the` \
              `#   production values (on, 10 requests / 60s).` \
              `#! NOT PASSED — AWS credentials: the app uses the EC2 instance role,` \
              `#   which needs the cognito-idp actions plus ses:SendEmail.` \
              ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest

            #* ── DISK CLEANUP ─────────────────────────────────────────────────
            # Run last: removes old unused images after the new container is running. No --volumes to keep data safe.
            docker system prune -af
