name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "regulaone/backend/prod" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod   

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Jar
        working-directory: RegulaOne/backend
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build Docker Image
        working-directory: RegulaOne/backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest .

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.KEY }}
          script: |
            docker stop regulaone-backend || true
            docker rm regulaone-backend || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest

            #! ── CONFIGURATION ────────────────────────────────────────────────
            # The image contains NO application*.properties file — they are all
            # git-ignored, so the checkout CI builds from has none. Every setting
            # therefore arrives here as an environment variable, named after the
            # Spring property it sets (Spring's relaxed binding uppercases the
            # property and turns dots and hyphens into underscores).
            #
            # That is why the -e names differ from the GitHub secret names:
            # the secret keeps its short shared name (MONGODB_URI), while the
            # variable must be what the application reads (SPRING_MONGODB_URI).
            #
            # AWS credentials are deliberately NOT passed. With none set, the SDK
            # falls back to the EC2 instance role, which must carry the
            # cognito-idp actions used by CognitoService plus ses:SendEmail.
            #
            # The rate-limit settings are also absent on purpose: their defaults in
            # code are already the production values (on, 10 requests / 60s).
            docker run -d --name regulaone-backend \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e AWS_COGNITO_REGION="${{ secrets.COGNITO_REGION }}" \
              -e AWS_COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e AWS_COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
              -e AWS_COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
              -e NOTIFICATION_INTERNAL_SERVICE_TOKEN="${{ secrets.NOTIFICATION_INTERNAL_TOKEN }}" \
              -e APP_NOTIFICATIONS_FROM="no-reply@komplyy.pl" \
              -e CORS_ALLOWED_ORIGINS="https://app.regulaone.eu,https://ksefflow.regulaone.eu,https://workpulse.regulaone.eu,https://safework.regulaone.eu,https://safevoice.regulaone.eu,https://wastesync.regulaone.eu,https://privacypilot.regulaone.eu" \
              -e SSO_COOKIE_DOMAIN=".regulaone.eu" \
              -e SSO_COOKIE_SECURE=true \
              -e SSO_COOKIE_SAME_SITE=Lax \
              -e SSO_CENTRAL_LOGIN_URL="https://app.regulaone.eu/login" \
              -e SPRINGDOC_API_DOCS_ENABLED=false \
              -e SPRINGDOC_SWAGGER_UI_ENABLED=false \
              -e NOTIFICATION_TEST_ENABLED=false \
              ${{ secrets.DOCKER_USERNAME }}/regulaone-backend:latest
